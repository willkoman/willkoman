name: ci

on:
  push:
    branches: [main]
    paths: ['steam-input-editor/**']
  pull_request:
    paths: ['steam-input-editor/**']

defaults:
  run:
    working-directory: steam-input-editor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: steam-input-editor/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: padsmith-dist-${{ github.sha }}
          path: steam-input-editor/dist
          retention-days: 7
