name: ci

on:
  push:
    branches: [main]
    paths: ['steam-input-editor/**']
  pull_request:
    paths: ['steam-input-editor/**']

defaults:
  run:
    working-directory: steam-input-editor

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: steam-input-editor/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
